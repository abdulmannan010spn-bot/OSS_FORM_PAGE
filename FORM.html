<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSS Form Page</title>
    <link rel="stylesheet" href="FORM.css" />
  </head>

  <body>
    <div class="grid">
      <div class="window">
        <div class="titlebar">
          <div class="dots">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="oss">OSS R&amp;DC</div>
        </div>

        <div class="content">
          <aside class="sideBAR">
            <div class="intbox">
              <div class="int26">
                INIT'26
                <div class="line"></div>
              </div>
            </div>

            <nav>
              <a class="active">REGISTRATION</a>
              <a>AUTH_PROTOCOL</a>
              <a>NET_CONFIG</a>
            </nav>

            <div class="status">
              <p>// SYS_LOAD: COMPLETE</p>
              <p>// STATUS: ACTIVE</p>
            </div>
          </aside>

          <main class="main">
            <div class="container">
              <div class="title">INIT'26</div>

              <div class="path">
                OPEN SOURCE SOFTWARE RESEARCH &amp; DEVELOPMENT CENTRE
              </div>

              <form action="#">
                <div class="user-details">
                  <label>"Full_name": String</label>

                  <div class="input-box">
                    <span class="details">{</span>
                    <input
                      type="text"
                      placeholder="Enter Your Name"
                      required
                    />
                    <span class="details">}</span>
                  </div>

                  <label>"Email_address": String</label>

                  <div class="input-box">
                    <span class="details">{</span>
                    <input
                      type="email"
                      placeholder="xyz@gmail.com"
                      required
                    />
                    <span class="details">}</span>
                  </div>

                  <label>"Student Number": Int</label>

                  <div class="input-box">
                    <span class="details">{</span>
                    <input
                      type="number"
                      placeholder="Enter Your Student Number"
                      required
                    />
                    <span class="details">}</span>
                  </div>

                  <label>"Phone Number": Int</label>

                  <div class="input-box">
                    <span class="details">{</span>
                    <input
                      type="number"
                      placeholder="Enter Your Phone Number"
                      required
                    />
                    <span class="details">}</span>
                  </div>

                  <label>"Github_handle": String</label>

                  <div class="input-box">
                    <span class="details">{</span>
                    <input
                      type="text"
                      placeholder="Enter Your GitHub ID"
                      required
                    />
                    <span class="details">}</span>
                  </div>

                  <label>"DOMAIN": OPTIONS</label>

                  <div class="input-box">
                    <span class="details">{</span>

                    <select required>
                      <option value="">SELECT_DOMAIN</option>
                      <option>FRONTEND</option>
                      <option>BACKEND</option>
                      <option>APP DEVELOPER</option>
                      <option>AIML</option>
                      <option>DESIGNER</option>
                      <option>VIDEO EDITOR</option>
                    </select>

                    <span class="details">}</span>
                  </div>

                  <button type="submit">EXECUTE COMMIT ↵</button>
                </div>
              </form>
            </div>
          </main>
        </div>

        <footer>
          <div class="osslgo">
            <img src="osslogo.png" alt="OSS Logo" />
          </div>

          <div class="links">
            <a href="#">CODE OF CONDUCT</a>
            <a href="#">PRIVACY POLICY</a>
            <a href="#">GITHUB</a>
            <a href="#">DISCORD</a>
          </div>
        </footer>
      </div>
    </div>
    <script src="FORM.js"></script>
  </body>
</html>
